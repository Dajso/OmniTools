server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;

    # Cache static assets for 1 year
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images/fonts
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Verktøy som er flyttet eller fått nye adresser
    location ~ ^/calculators/productivity/angle-converter/?$ { return 301 /convert/degree-to-radian/; }
    location ~ ^/calculators/productivity/frequency-converter/?$ { return 301 /convert/megahertz-to-kilohertz/; }
    location ~ ^/calculators/productivity/fuel-economy-converter/?$ { return 301 /convert/liters-per100-km-to-km-per-liter/; }
    location ~ ^/calculators/productivity/power-converter/?$ { return 301 /convert/kilowatt-to-horsepower-metric/; }
    location ~ ^/calculators/productivity/torque-converter/?$ { return 301 /convert/newton-meter-to-foot-pound/; }
    location ~ ^/calculators/productivity/force-converter/?$ { return 301 /convert/newton-to-kilopond/; }
    location ~ ^/calculators/productivity/density-converter/?$ { return 301 /convert/kilogram-per-cubic-meter-to-gram-per-cubic-centimeter/; }
    location ~ ^/calculators/productivity/illuminance-converter/?$ { return 301 /convert/lux-to-foot-candle/; }
    location ~ ^/calculators/productivity/currency-converter/?$ { return 301 /calculators/travel/currency-converter/; }

    location ~ ^/convert/squareFoot-to-squareMeter/?$ { return 301 /convert/square-foot-to-square-meter/; }
    location ~ ^/convert/milePerHour-to-kilometerPerHour/?$ { return 301 /convert/mile-per-hour-to-kilometer-per-hour/; }

    # Next.js static export routing with trailing slash
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Error page
    error_page 404 /404/index.html;
}
