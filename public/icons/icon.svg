<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Calculator icon stylized -->
  <g fill="#ffffff">
    <!-- Main body -->
    <rect x="136" y="96" width="240" height="320" rx="24" fill="#ffffff" opacity="0.95"/>
    <!-- Display screen -->
    <rect x="160" y="120" width="192" height="72" rx="12" fill="#1e1b4b"/>
    <!-- Buttons grid -->
    <circle cx="196" cy="236" r="20" fill="#6366f1"/>
    <circle cx="256" cy="236" r="20" fill="#6366f1"/>
    <circle cx="316" cy="236" r="20" fill="#6366f1"/>
    <circle cx="196" cy="296" r="20" fill="#6366f1"/>
    <circle cx="256" cy="296" r="20" fill="#6366f1"/>
    <circle cx="316" cy="296" r="20" fill="#6366f1"/>
    <circle cx="196" cy="356" r="20" fill="#6366f1"/>
    <circle cx="256" cy="356" r="20" fill="#6366f1"/>
    <circle cx="316" cy="356" r="20" fill="#f59e0b"/>
  </g>
  <!-- "O" letter stylized as Omni symbol -->
  <circle cx="380" cy="132" r="40" fill="#ffffff" stroke="#1e1b4b" stroke-width="8"/>
  <circle cx="380" cy="132" r="20" fill="#1e1b4b"/>
</svg>
